[CoreRedirects]
; These classes used to live in the host project's own C++ module (e.g. "MyProject") before being
; extracted into this plugin (2026-09-13), so any Blueprint asset that still has old serialized
; references (MasterMenu variable, CreateWidget class pins, Class|LanessaV2Widget|* function-call
; nodes, etc.) baked in from before the extraction needs a redirect to resolve them to the new
; module on load instead of breaking. Living HERE (in the plugin's own Config folder) means this
; travels automatically with the plugin into any project it's copied into - no per-project
; DefaultEngine.ini edit needed. Add one more OldName line per host-project module name this plugin
; has ever been extracted from/duplicated into, if that ever happens again.
+ClassRedirects=(OldName="/Script/MyProject.LanessaV2Widget",NewName="/Script/Lanessa.LanessaV2Widget")
+ClassRedirects=(OldName="/Script/MyProject.LanessaInteriorTourWidget",NewName="/Script/Lanessa.LanessaInteriorTourWidget")
+ClassRedirects=(OldName="/Script/MyProject.LanessaMasterMenuWidget",NewName="/Script/Lanessa.LanessaMasterMenuWidget")
